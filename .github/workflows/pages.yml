# Build the 2dog browser bundle and deploy it to GitHub Pages.
# One-time repo setup: Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish web AppBundle
        # CDNs compress on the wire; skip .br/.gz siblings to keep the artifact smaller.
        run: dotnet publish TDProject.web -c Release -p:TwoDogWebPrecompress=false

      - name: Add .nojekyll
        # Without this, GitHub Pages' Jekyll step drops underscore dirs like _framework/.
        run: touch TDProject.web/AppBundle/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: TDProject.web/AppBundle

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
